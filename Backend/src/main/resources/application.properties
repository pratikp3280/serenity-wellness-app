
# ==========================================
# SERENITY APPLICATION
# ==========================================
spring.application.name=serenity-backend


# ==========================================
# MYSQL DATABASE CONNECTION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/serenity_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# FLYWAY DATABASE MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# DEPLOYMENT / SERVER CONFIGURATION
# ==========================================

# Railway provides PORT automatically.
server.port=${PORT:8080}

# Local default; configure the actual Pages origin in Railway.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Set SECURE_COOKIES=true in the HTTPS production environment.
app.security.cookie-secure=${SECURE_COOKIES:false}

# Browser session cookie settings.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax